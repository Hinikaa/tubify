specfile_path: packaging/rpm/tubify.spec
upstream_package_name: tubify
upstream_tag_template: v{version}

jobs:
  - job: copr_build
    trigger: release
    owner: shredos
    project: tubify
    enable_net: true
    targets:
      - fedora-all-x86_64
      - fedora-all-aarch64
      - opensuse-tumbleweed-x86_64
      - opensuse-tumbleweed-aarch64
