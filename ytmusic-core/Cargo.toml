[package]
name = "ytmusic-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
env_logger = "=0.11.11"
hound = "3.5.1"
log = "0.4"
lofty = "=0.25.4"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "flac", "wav", "mp3", "vorbis", "mp4", "symphonia-alac", "symphonia-aiff"] }
rustfft = "=6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10.6"
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm", "aiff", "isomp4", "aac", "alac"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }

[features]
default = []
capi = []

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
